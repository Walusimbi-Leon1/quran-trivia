<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Lobby / Join Screen -->
    <div id="lobby" class="screen active">
      <div class="logo">📖 Bible Game</div>
      <p class="subtitle">Fill in the missing words. First correct answer wins the points!</p>
      <div class="lobby-controls">
        <div class="input-group">
          <label for="player-name">Your Name</label>
          <input type="text" id="player-name" placeholder="Enter your name..." maxlength="20" />
        </div>
        <div class="input-group">
          <label for="room-name">Room Code</label>
          <input type="text" id="room-name" placeholder="Or leave blank for random room..." maxlength="10" />
        </div>
        <button id="btn-join" class="btn primary">Join / Create Room</button>
      </div>
      <div id="room-list" class="room-list">
        <h3>Active Rooms</h3>
        <div id="active-rooms"></div>
      </div>
    </div>

    <!-- Room / Waiting Screen -->
    <div id="room" class="screen">
      <div class="room-header">
        <span>Room: <strong id="room-code">---</strong></span>
        <span id="player-count">0 players</span>
        <button id="btn-start" class="btn primary">Start Game</button>
      </div>
      <div id="players-list" class="players-list"></div>
      <div class="invite-hint">Share the room code to invite friends!</div>
    </div>

    <!-- Game Screen -->
    <div id="game" class="screen">
      <div class="game-header">
        <span>Round <span id="round-num">1</span></span>
        <span>Score: <span id="my-score">0</span></span>
        <button id="btn-leave" class="btn small">Leave</button>
      </div>

      <div id="verse-display" class="verse-display">
        <div id="verse-ref" class="verse-ref">—</div>
        <div id="verse-text" class="verse-text"></div>
      </div>

      <div id="guess-area" class="guess-area">
        <input
          type="text"
          id="guess-input"
          placeholder="Type the missing word and press Enter..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <div id="feedback" class="feedback"></div>

      <div class="leaderboard-section">
        <h3>Leaderboard</h3>
        <div id="leaderboard"></div>
      </div>
    </div>

    <!-- Results Screen -->
    <div id="results" class="screen">
      <h1>🏆 Game Over!</h1>
      <div id="final-leaderboard"></div>
      <button id="btn-play-again" class="btn primary">Play Again</button>
      <button id="btn-back-lobby" class="btn secondary">Back to Lobby</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
