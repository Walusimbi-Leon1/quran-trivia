name: Generate Quran Trivia Questions

# Keep the game's question bank topped up. The game drains ~180 questions/hour
# (20s per question, clock runs 24/7), so this runs every 30 minutes to keep
# ~2 hours of runway. Public repo → free unlimited Actions minutes.
# Every batch sources fresh surahs from the SGSS Quran repo and generates
# questions with NVIDIA Neomotron (primary) — opencode.ai big-pickle was
# rate-limiting GitHub runners. Falls back to opencode.ai if NVIDIA fails.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-questions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate & refill question bank
        run: node scripts/generate-questions.js
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FB_HOST: bible-game-21-default-rtdb.firebaseio.com
